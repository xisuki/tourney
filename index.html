<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tourney.</title>
    <style>
        body { font-family: Arial; }
        :root { --primary: #1a73e8; }
        .match-card { cursor: default; }
        .match-card .match .team { cursor: default; }
        .tooltip {
            position: fixed;
            background: var(--surface-solid);
            backdrop-filter: var(--backdrop-blur);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2), 0 0 0 1px var(--glass-border);
            z-index: 9998;
            display: none;
            min-width: 200px;
            animation: fadeIn 0.2s ease;
            color: var(--text);
        }
        .tooltip.active { display: block; }
        .tooltip .tooltip-title {
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--primary);
        }
        .tooltip .tooltip-game {
            font-size: 0.85rem;
            padding: 2px 0;
            color: var(--text-light);
        }
        .tooltip .tooltip-game .score-highlight {
            color: var(--text);
            font-weight: 600;
        }
        .scores-inline {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            width: 100%;
        }
        .scores-inline.active {
            max-height: 500px;
            opacity: 1;
        }
        .scores-inline .game-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0;
            font-size: 0.85rem;
        }
        .scores-inline .game-row .label {
            min-width: 50px;
            color: var(--text-light);
            font-weight: 500;
        }
        .scores-inline .game-row .score-highlight {
            font-weight: 600;
            color: var(--text);
        }
        .scores-inline .game-row .sep {
            color: var(--text-light);
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: var(--text-light);
            font-size: 0.9rem;
        }
        /* TBD style */
        .match-card .match .team.tbd {
            color: var(--text-light);
            font-style: italic;
        }
        .match-card .match .team.bye {
            color: var(--bye-color);
            font-style: italic;
        }
        .match-card .match .team.winner .school {
            color: #a5d6a7;
        }
    </style>
</head>
<body>
    <div class="container" style="position:relative;">
        <div class="title-wrapper">
            <h1>tourney.</h1>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        </div>
        <div class="subhead" style="display:flex; gap:15px; align-items:center;">
            <span>Tournament Bracket – Live View</span>
        </div>
        <div id="bracketContainer" class="bracket-view">
<div class="round-wrapper"><div class="round-title">Semi‑finals</div>
                <div class="match-card" data-matchid="0" onclick="toggleScores(0)">
                    <div class="match has-winner">
                        <div class="teams">
                            <span class="team">
                                ds
                                <span class="school">awdawdad</span>
                            </span>
                            <span class="separator">vs</span>
                            <span class="team winner">
                                awdaw
                                <span class="school">dawda</span>
                            </span>
                        </div>
                        <div class="winner-badge">1 : 2</div>
                        <div class="scores-inline" id="scores-0">
                            <div style="font-weight:600;color:var(--primary);margin-bottom:4px;">Overall: 1 : 2</div>
                            <div class="game-row"><span class="label">Game 1:</span><span class="score-highlight">3</span><span class="sep">:</span><span class="score-highlight">0</span></div><div class="game-row"><span class="label">Game 2:</span><span class="score-highlight">2</span><span class="sep">:</span><span class="score-highlight">4</span></div><div class="game-row"><span class="label">Game 3:</span><span class="score-highlight">0</span><span class="sep">:</span><span class="score-highlight">4</span></div>
                            
                        </div>
                    </div>
                </div>
                <div class="match-card" data-matchid="1" onclick="toggleScores(1)">
                    <div class="match ">
                        <div class="teams">
                            <span class="team">
                                awd
                                <span class="school">aweaffea</span>
                            </span>
                            <span class="separator">vs</span>
                            <span class="team">
                                eaf
                                <span class="school">eafefa</span>
                            </span>
                        </div>
                        
                        <div class="scores-inline" id="scores-1">
                            
                            
                            <div style="color:var(--text-light);font-size:0.85rem;">No scores recorded</div>
                        </div>
                    </div>
                </div></div><div class="round-wrapper"><div class="round-title">Final</div>
                <div class="match-card" data-matchid="2" onclick="toggleScores(2)">
                    <div class="match ">
                        <div class="teams">
                            <span class="team">
                                awdaw
                                <span class="school">dawda</span>
                            </span>
                            <span class="separator">vs</span>
                            <span class="team tbd">
                                TBD
                                <span class="school"></span>
                            </span>
                        </div>
                        
                        <div class="scores-inline" id="scores-2">
                            
                            
                            <div style="color:var(--text-light);font-size:0.85rem;">No scores recorded</div>
                        </div>
                    </div>
                </div></div>
        <script>
            let tooltipTimeout = null;
            function toggleTheme() {
                const html = document.documentElement;
                const current = html.getAttribute('data-theme');
                const newTheme = current === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            }
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);

            function toggleScores(matchId) {
                const el = document.getElementById('scores-' + matchId);
                if (el) {
                    el.classList.toggle('active');
                    setTimeout(drawCurvyLines, 300);
                }
            }

            document.querySelectorAll('.match-card').forEach(card => {
                card.addEventListener('mouseenter', function(e) {
                    const scoresEl = this.querySelector('.scores-inline');
                    if (!scoresEl || !scoresEl.querySelector('.game-row')) return;
                    const tooltip = document.createElement('div');
                    tooltip.className = 'tooltip';
                    tooltip.id = 'static-tooltip';
                    const title = this.querySelector('.teams').textContent.trim();
                    tooltip.innerHTML = `<div class="tooltip-title">${title}</div>${scoresEl.innerHTML}`;
                    document.body.appendChild(tooltip);
                    tooltip.style.left = (e.clientX + 15) + 'px';
                    tooltip.style.top = (e.clientY + 15) + 'px';
                    tooltip.classList.add('active');
                    clearTimeout(tooltipTimeout);
                });
                card.addEventListener('mouseleave', function() {
                    tooltipTimeout = setTimeout(() => {
                        const el = document.getElementById('static-tooltip');
                        if (el) el.remove();
                    }, 200);
                });
            });

            function drawCurvyLines() {
                document.querySelectorAll('.bracket-svg').forEach(el => el.remove());
                const container = document.getElementById('bracketContainer');
                if (!container) return;
                const rect = container.getBoundingClientRect();
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('class', 'bracket-svg');
                svg.style.width = rect.width + 'px';
                svg.style.height = rect.height + 'px';
                const cards = container.querySelectorAll('.match-card');
                const positions = {};
                cards.forEach(el => {
                    const id = parseInt(el.dataset.matchid);
                    const r = el.getBoundingClientRect();
                    positions[id] = {
                        top: r.top - rect.top + (r.height / 2),
                        left: r.left - rect.left + r.width,
                    };
                });
                const rounds = container.querySelectorAll('.round-wrapper');
                for (let i = 0; i < rounds.length - 1; i++) {
                    const current = rounds[i].querySelectorAll('.match-card');
                    const next = rounds[i+1].querySelectorAll('.match-card');
                    for (let j = 0; j < current.length; j += 2) {
                        const parentIdx = Math.floor(j / 2);
                        if (parentIdx >= next.length) break;
                        const child = current[j];
                        const child2 = current[j+1] || current[j];
                        const parent = next[parentIdx];
                        if (!child || !parent) continue;
                        const cId = parseInt(child.dataset.matchid);
                        const pId = parseInt(parent.dataset.matchid);
                        const cPos = positions[cId];
                        const pPos = positions[pId];
                        if (!cPos || !pPos) continue;
                        const midX = (cPos.left + pPos.left) / 2;
                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        const d = `M ${cPos.left} ${cPos.top} Q ${midX} ${cPos.top}, ${midX} ${(cPos.top + pPos.top)/2} Q ${midX} ${pPos.top}, ${pPos.left} ${pPos.top}`;
                        path.setAttribute('d', d);
                        svg.appendChild(path);
                        if (child2 && child2 !== child) {
                            const c2Id = parseInt(child2.dataset.matchid);
                            const c2Pos = positions[c2Id];
                            if (c2Pos) {
                                const d2 = `M ${c2Pos.left} ${c2Pos.top} Q ${midX} ${c2Pos.top}, ${midX} ${(c2Pos.top + pPos.top)/2} Q ${midX} ${pPos.top}, ${pPos.left} ${pPos.top}`;
                                const path2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                                path2.setAttribute('d', d2);
                                svg.appendChild(path2);
                            }
                        }
                    }
                }
                container.appendChild(svg);
            }

            setTimeout(drawCurvyLines, 200);
            window.addEventListener('resize', () => {
                setTimeout(drawCurvyLines, 300);
            });
        </script>
        
        </div>
        <div class="footer">Generated by Tourney Hall • tourney.</div>
    </div>
</body>
</html>
