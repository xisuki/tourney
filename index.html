<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oisjeadawda</title>
    <style>
        /* ===== THEMES ===== */
html, body {
    overflow: visible !important;
}
:root {
    --bg-start: #e8edf5;
    --bg-end: #d0d9e8;
    --surface: rgba(255,255,255,0.6);
    --surface-solid: #ffffff;
    --text: #1a1a2e;
    --text-light: #5a6a7a;
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --border: rgba(0,0,0,0.08);
    --shadow: 0 8px 32px rgba(0,0,0,0.08);
    --glass-border: rgba(255,255,255,0.25);
    --highlight: rgba(26,115,232,0.06);
    --bye-color: #999;
    --error-bg: #fee;
    --success-bg: #e6ffed;
    --backdrop-blur: blur(12px);
}
[data-theme="dark"] {
    --bg-start: #0f0f1a;
    --bg-end: #1a1a2e;
    --surface: rgba(30,30,50,0.6);
    --surface-solid: #1a1a2e;
    --text: #e8e8f0;
    --text-light: #9a9ab0;
    --primary: #4a8cf7;
    --primary-dark: #3a7ae0;
    --border: rgba(255,255,255,0.06);
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --glass-border: rgba(255,255,255,0.08);
    --highlight: rgba(74,140,247,0.1);
    --bye-color: #666;
    --error-bg: #2a1414;
    --success-bg: #142a1a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.4s, color 0.3s;
    background-attachment: fixed;
    margin: 0;
}
.container {
    max-width: 1200px;
    width: 100%;
    background: var(--surface);
    backdrop-filter: var(--backdrop-blur);
    -webkit-backdrop-filter: var(--backdrop-blur);
    padding: 35px 40px;
    border-radius: 24px;
    box-shadow: var(--shadow);
    border: 1px solid var(--glass-border);
    transition: all 0.3s;
    position: relative;
    z-index: 1;
}
.title-wrapper {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 4px;
}
h1 {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--primary);
    margin: 0;
    letter-spacing: -0.5px;
    outline: none;
    border: none;
    background: transparent;
    padding: 0;
    width: 100%;
    font-family: inherit;
}
h1:focus {
    outline: 2px dashed var(--primary);
    outline-offset: 6px;
    border-radius: 4px;
}
.theme-toggle {
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: 0.2s;
    color: var(--text);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.theme-toggle:hover { transform: rotate(15deg); }
.subhead {
    color: var(--text-light);
    margin-bottom: 25px;
    font-size: 1rem;
}
.section {
    background: var(--surface-solid);
    padding: 20px 24px;
    border-radius: 16px;
    margin-bottom: 24px;
    border: 1px solid var(--border);
    transition: background 0.3s;
}
.section h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-top: 0;
    margin-bottom: 12px;
    color: var(--text);
}
input, textarea, button {
    padding: 10px 14px;
    margin: 4px 4px 4px 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--surface-solid);
    color: var(--text);
    transition: border 0.2s, box-shadow 0.2s, background 0.3s;
}
input:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
}
button {
    background: var(--primary);
    color: #fff;
    border: none;
    cursor: pointer;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 10px;
    transition: 0.15s;
    box-shadow: 0 2px 6px rgba(26,115,232,0.2);
    font-size: 0.95rem;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
button:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(26,115,232,0.3);
    background: var(--primary-dark);
}
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
button.secondary {
    background: var(--surface-solid);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: none;
}
button.secondary:hover { background: var(--highlight); transform: none; }
button.danger {
    background: #f44336;
    box-shadow: 0 2px 6px rgba(244,67,54,0.25);
}
button.danger:hover { background: #d32f2f; }
.btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
}
.btn-group button { flex: 0 1 auto; }
.school-group { margin-bottom: 16px; }
.school-header {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--primary);
    padding: 4px 0;
    border-bottom: 2px solid var(--border);
    margin-bottom: 8px;
}
.team-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 0;
}
.team-chip {
    background: var(--surface-solid);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 0.9rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
}
.team-chip .delete-btn {
    background: none;
    border: none;
    color: #f44336;
    font-weight: bold;
    cursor: pointer;
    padding: 0 4px;
    font-size: 1.1rem;
    box-shadow: none;
    min-height: auto;
}
.team-chip .seed-badge {
    color: #f5a623;
    font-weight: 600;
    font-size: 0.8rem;
}
.batch-area {
    width: 100%;
    min-height: 120px;
    font-family: 'Consolas', monospace;
    font-size: 0.9rem;
    padding: 12px;
    resize: vertical;
    background: var(--surface-solid);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
}
#toast-container {
    position: fixed !important;
    top: 24px !important;
    right: 24px !important;
    z-index: 9999 !important;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.toast {
    background: var(--surface-solid);
    padding: 14px 20px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    border-left: 6px solid var(--primary);
    animation: slideIn 0.3s ease;
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 500;
    color: var(--text);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--backdrop-blur);
}
.toast.error { border-left-color: #f44336; }
.toast.success { border-left-color: #4caf50; }
.toast .toast-close {
    cursor: pointer;
    margin-left: auto;
    font-weight: bold;
    color: var(--text-light);
    font-size: 1.2rem;
}
.toast .toast-close:hover { color: var(--text); }
@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
@keyframes slideOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(100%); opacity: 0; }
}

/* ===== BRACKET VIEW ===== */
.bracket-view {
    position: relative;
    display: flex;
    flex-direction: row;
    justify-content: center;
    overflow-x: auto;
    padding: 20px 0 10px 0;
    gap: 30px;
}
.round-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    min-width: 170px;
    flex: 0 0 auto;
}
.round-title {
    text-align: center;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 6px 18px;
    margin-bottom: 18px;
    background: var(--surface-solid);
    border-radius: 30px;
    display: inline-block;
    margin-left: auto;
    margin-right: auto;
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--backdrop-blur);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    color: var(--primary);
    letter-spacing: 0.3px;
}
.match-card {
    position: relative;
    z-index: 1;
    margin: 8px 0;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    background: var(--surface-solid);
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    padding: 12px 16px;
    border-left: 4px solid var(--primary);
    backdrop-filter: var(--backdrop-blur);
    overflow: hidden;
}
.match-card:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.match-card.has-winner {
    border-left-color: #4caf50;
}
/* --- Team formatting --- */
.match-card .match .teams {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    gap: 6px;
}
.match-card .match .team {
    font-weight: 700;
    font-size: 1.05rem;
    text-align: center;
    padding: 4px 8px;
    border-radius: 8px;
    flex: 1;
}
.match-card .match .team .school {
    font-size: 0.7rem;
    color: var(--text-light);
    display: block;
    font-weight: 400;
}
.match-card .match .team.bye {
    color: var(--bye-color);
    font-style: italic;
    font-weight: 400;
}
.match-card .match .team.winner {
    background: #4caf50;
    color: #fff;
    font-weight: 700;
    border-radius: 8px;
    padding: 4px 12px;
}
.match-card .match .team.winner .school {
    color: #a5d6a7;
}
.match-card .match .separator {
    font-size: 0.85rem;
    font-weight: 300;
    color: var(--text-light);
    padding: 0 4px;
}
/* --- Winner badge (overall score) --- */
.match-card .winner-badge {
    font-size: 0.9rem;
    color: #2e7d32;
    margin-top: 4px;
    font-weight: 600;
    background: var(--success-bg);
    padding: 2px 14px;
    border-radius: 20px;
    text-align: center;
}
/* --- Inline scores --- */
.match-card .scores-inline {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
    width: 100%;
}
.match-card .scores-inline.active {
    max-height: 500px;
    opacity: 1;
    margin-top: 10px;
}
.match-card .scores-inline .game-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 4px 0;
    font-size: 0.85rem;
}
.match-card .scores-inline .game-row input {
    width: 50px;
    padding: 4px 6px;
    text-align: center;
    font-size: 0.85rem;
}
.match-card .scores-inline .game-row .label {
    min-width: 50px;
    color: var(--text-light);
    font-weight: 500;
}
.match-card .scores-inline .game-row .sep {
    color: var(--text-light);
}
.match-card .scores-inline .btn-group {
    margin-top: 8px;
    gap: 6px;
    justify-content: flex-end;
}
.match-card .scores-inline .btn-group button {
    padding: 4px 14px;
    font-size: 0.8rem;
    min-height: 32px;
}

/* SVG lines */
.bracket-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    transition: opacity 0.3s;
}
.bracket-svg path {
    stroke: var(--primary);
    stroke-width: 2.5;
    fill: none;
    opacity: 0.35;
    stroke-linecap: round;
}
[data-theme="dark"] .bracket-svg path { opacity: 0.25; }

/* Tooltip */
.tooltip {
    position: fixed;
    background: var(--surface-solid);
    backdrop-filter: var(--backdrop-blur);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 16px 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2), 0 0 0 1px var(--glass-border);
    z-index: 9998;
    display: none;
    min-width: 200px;
    animation: fadeIn 0.2s ease;
    color: var(--text);
}
.tooltip.active { display: block; }
.tooltip .tooltip-title {
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--primary);
}
.tooltip .tooltip-game {
    font-size: 0.85rem;
    padding: 2px 0;
    color: var(--text-light);
}
.tooltip .tooltip-game .score-highlight {
    color: var(--text);
    font-weight: 600;
}
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}
.no-bracket {
    text-align: center;
    padding: 40px 20px;
    font-size: 1.1rem;
    color: var(--text-light);
}
@media (max-width: 800px) {
    .container { padding: 20px; }
    .bracket-view { flex-direction: column; align-items: center; gap: 20px; }
    .round-wrapper { min-width: 100%; }
    .btn-group button { flex: 1 1 100%; }
    h1 { font-size: 1.6rem; }
}
/* ---- Animated connector lines ---- */
.bracket-svg path {
    stroke-dasharray: 800;
    stroke-dashoffset: 800;
    animation: drawLine 1s ease forwards;
}
@keyframes drawLine {
    to {
        stroke-dashoffset: 0;
    }
}
.bracket-svg {
    transition: opacity 1s;
}
.match-card .match .team.tbd {
    color: var(--text-light);
    font-style: italic;
}
.group-label {
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text-light);
    margin-right: 6px;
    min-width: 70px;
}
.btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
}
.btn-group:last-child {
    margin-bottom: 0;
}

</head>
<body>
    <div class="container" style="position:relative;">
        <div class="title-wrapper">
            <h1>oisjeadawda</h1>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        </div>
        <div class="subhead" style="display:flex; gap:15px; align-items:center;">
            <span>Tournament Bracket – Live View</span>
