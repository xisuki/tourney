<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tourney.</title>
    <style>
        body { font-family: Arial; }
        :root { --primary: #1a73e8; }
        .match-card { cursor: default; }
        .match-card .match .team { cursor: default; }
        .tooltip {
            position: fixed;
            background: var(--surface-solid);
            backdrop-filter: var(--backdrop-blur);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2), 0 0 0 1px var(--glass-border);
            z-index: 9998;
            display: none;
            min-width: 200px;
            animation: fadeIn 0.2s ease;
            color: var(--text);
        }
        .tooltip.active { display: block; }
        .tooltip .tooltip-title {
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--primary);
        }
        .tooltip .tooltip-game {
            font-size: 0.85rem;
            padding: 2px 0;
            color: var(--text-light);
        }
        .tooltip .tooltip-game .score-highlight {
            color: var(--text);
            font-weight: 600;
        }
        .scores-inline {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            width: 100%;
        }
        .scores-inline.active {
            max-height: 500px;
            opacity: 1;
        }
        .scores-inline .game-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0;
            font-size: 0.85rem;
        }
        .scores-inline .game-row .label {
            min-width: 50px;
            color: var(--text-light);
            font-weight: 500;
        }
        .scores-inline .game-row .score-highlight {
            font-weight: 600;
            color: var(--text);
        }
        .scores-inline .game-row .sep {
            color: var(--text-light);
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: var(--text-light);
            font-size: 0.9rem;
        }
        /* TBD style */
        .match-card .match .team.tbd {
            color: var(--text-light);
            font-style: italic;
        }
        .match-card .match .team.bye {
            color: var(--bye-color);
            font-style: italic;
        }
        .match-card .match .team.winner .school {
            color: #a5d6a7;
        }
    </style>
</head>
<body>
    <div class="container" style="position:relative;">
        <div class="title-wrapper">
            <h1>tourney.</h1>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        </div>
        <div class="subhead" style="display:flex; gap:15px; align-items:center;">
            <span>Tournament Bracket – Live View</span>
        </div>
        <div id="bracketContainer" class="bracket-view">
<div class="no-bracket">No bracket has been generated yet.</div>
        </div>
        <div class="footer">Generated by Tourney Hall • tourney.</div>
    </div>
</body>
</html>
