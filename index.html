<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>test🌓Manage teams, generate28 – Bracket</title>
    <style>/* ===== THEMES ===== */
html, body {
    overflow: visible !important;
    transform: none !important;
    perspective: none !important;
}
:root {
    --bg-start: #e8edf5;
    --bg-end: #d0d9e8;
    --surface: rgba(255,255,255,0.6);
    --surface-solid: #ffffff;
    --text: #1a1a2e;
    --text-light: #5a6a7a;
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --border: rgba(0,0,0,0.08);
    --shadow: 0 8px 32px rgba(0,0,0,0.08);
    --glass-border: rgba(255,255,255,0.25);
    --highlight: rgba(26,115,232,0.06);
    --bye-color: #999;
    --error-bg: #fee;
    --success-bg: #e6ffed;
    --backdrop-blur: blur(12px);
}
[data-theme="dark"] {
    --bg-start: #0f0f1a;
    --bg-end: #1a1a2e;
    --surface: rgba(30,30,50,0.6);
    --surface-solid: #1a1a2e;
    --text: #e8e8f0;
    --text-light: #9a9ab0;
    --primary: #4a8cf7;
    --primary-dark: #3a7ae0;
    --border: rgba(255,255,255,0.06);
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --glass-border: rgba(255,255,255,0.08);
    --highlight: rgba(74,140,247,0.1);
    --bye-color: #666;
    --error-bg: #2a1414;
    --success-bg: #142a1a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.4s, color 0.3s;
    background-attachment: fixed;
    margin: 0;
}
.container {
    max-width: 1200px;
    width: 100%;
    background: var(--surface);
    backdrop-filter: var(--backdrop-blur);
    -webkit-backdrop-filter: var(--backdrop-blur);
    padding: 35px 40px;
    border-radius: 24px;
    box-shadow: var(--shadow);
    border: 1px solid var(--glass-border);
    transition: all 0.3s;
    position: relative;
    z-index: 1;
}
.title-wrapper {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 4px;
}
h1 {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--primary);
    margin: 0;
    letter-spacing: -0.5px;
    outline: none;
    border: none;
    background: transparent;
    padding: 0;
    width: 100%;
    font-family: inherit;
}
h1:focus {
    outline: 2px dashed var(--primary);
    outline-offset: 6px;
    border-radius: 4px;
}
.theme-toggle {
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: 0.2s;
    color: var(--text);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.theme-toggle:hover { transform: rotate(15deg); }
.subhead {
    color: var(--text-light);
    margin-bottom: 25px;
    font-size: 1rem;
}
.section {
    background: var(--surface-solid);
    padding: 20px 24px;
    border-radius: 16px;
    margin-bottom: 24px;
    border: 1px solid var(--border);
    transition: background 0.3s;
}
.section h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-top: 0;
    margin-bottom: 12px;
    color: var(--text);
}
input, textarea, button {
    padding: 10px 14px;
    margin: 4px 4px 4px 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--surface-solid);
    color: var(--text);
    transition: border 0.2s, box-shadow 0.2s, background 0.3s;
}
input:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
}
button {
    background: var(--primary);
    color: #fff;
    border: none;
    cursor: pointer;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 10px;
    transition: 0.15s;
    box-shadow: 0 2px 6px rgba(26,115,232,0.2);
    font-size: 0.95rem;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
button:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(26,115,232,0.3);
    background: var(--primary-dark);
}
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
button.secondary {
    background: var(--surface-solid);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: none;
}
button.secondary:hover { background: var(--highlight); transform: none; }
button.danger {
    background: #f44336;
    box-shadow: 0 2px 6px rgba(244,67,54,0.25);
}
button.danger:hover { background: #d32f2f; }
.btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
}
.btn-group button { flex: 0 1 auto; }
.school-group { margin-bottom: 16px; }
.school-header {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--primary);
    padding: 4px 0;
    border-bottom: 2px solid var(--border);
    margin-bottom: 8px;
}
.team-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 0;
}
.team-chip {
    background: var(--surface-solid);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 0.9rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
}
.team-chip .delete-btn {
    background: none;
    border: none;
    color: #f44336;
    font-weight: bold;
    cursor: pointer;
    padding: 0 4px;
    font-size: 1.1rem;
    box-shadow: none;
    min-height: auto;
}
.team-chip .seed-badge {
    color: #f5a623;
    font-weight: 600;
    font-size: 0.8rem;
}
.batch-area {
    width: 100%;
    min-height: 120px;
    font-family: 'Consolas', monospace;
    font-size: 0.9rem;
    padding: 12px;
    resize: vertical;
    background: var(--surface-solid);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
}
/* Toast container – fixed to viewport */
#toast-container {
    position: fixed !important;
    top: 24px !important;
    right: 24px !important;
    z-index: 99999 !important;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
}
.toast {
    pointer-events: auto;
    background: var(--surface-solid);
    padding: 14px 20px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    border-left: 6px solid var(--primary);
    animation: slideIn 0.3s ease;
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 500;
    color: var(--text);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--backdrop-blur);
}
.toast.error { border-left-color: #f44336; }
.toast.success { border-left-color: #4caf50; }
.toast .toast-close {
    cursor: pointer;
    margin-left: auto;
    font-weight: bold;
    color: var(--text-light);
    font-size: 1.2rem;
}
.toast .toast-close:hover { color: var(--text); }
@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
@keyframes slideOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(100%); opacity: 0; }
}

/* ===== BRACKET VIEW ===== */
.bracket-view {
    position: relative;
    display: flex;
    flex-direction: row;
    justify-content: center;
    overflow-x: auto;
    padding: 20px 20px 10px 20px;
    gap: 30px;
}
.round-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    min-width: 170px;
    flex: 0 0 auto;
}
.round-wrapper .match-container {
    justify-content: flex-start !important;
}
.round-title {
    text-align: center;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 6px 18px;
    margin-bottom: 18px;
    background: var(--surface-solid);
    border-radius: 30px;
    display: inline-block;
    margin-left: auto;
    margin-right: auto;
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--backdrop-blur);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    color: var(--primary);
    letter-spacing: 0.3px;
}
.match-card {
    position: relative;
    z-index: 1;
    margin: 8px 0;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    background: var(--surface-solid);
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    padding: 12px 16px;
    border-left: 4px solid var(--primary);
    backdrop-filter: var(--backdrop-blur);
    overflow: visible !important;
    width: 200px;          /* fixed width, enough for scores */
    min-width: 200px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
}
.match-card .match {
    width: 100%;
}
.match-card:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.match-card.has-winner {
    border-left-color: #4caf50;
}
/* ---- Team formatting (School-first) ---- */
.match-card .match .teams {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    gap: 4px;
}
.match-card .match .team {
    flex: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    font-weight: 700;
    font-size: 1rem;
    padding: 4px 8px;
    border-radius: 8px;
    transition: background 0.15s;
    cursor: default;
}
.match-card .match .team strong {
    font-weight: 700;
    font-size: 1rem;
}
.match-card .match .team .sub {
    font-size: 0.75rem;
    color: var(--text-light);
    font-weight: 400;
}
.match-card .match .team.bye {
    color: var(--bye-color);
    font-style: italic;
    font-weight: 400;
}
.match-card .match .team.winner {
    background: #4caf50 !important;
    color: #fff !important;
    border-radius: 8px;
    padding: 4px 12px;
}
.match-card .match .team.winner strong {
    color: #fff !important;
}
.match-card .match .team.winner .sub {
    color: #a5d6a7 !important;
}
.match-card .match .separator {
    flex: 0 0 auto;
    font-size: 0.85rem;
    font-weight: 300;
    color: var(--text-light);
    padding: 0 4px;
}
/* --- Winner badge (overall score) --- */
.match-card .winner-badge {
    font-size: 0.9rem;
    color: #2e7d32;
    margin-top: 4px;
    font-weight: 600;
    background: var(--success-bg);
    padding: 2px 14px;
    border-radius: 20px;
    text-align: center;
}
/* --- Inline scores (expands to full width) --- */
.match-card .scores-inline {
    margin-top: 0 !important;
    padding-top: 0 !important;
    border-top: 1px solid var(--border);
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
    width: 100%;
}
.match-card .scores-inline.active {
    margin-top: 10px !important;
    padding-top: 10px !important;
    max-height: 500px;
    opacity: 1;
}
.match-card .scores-inline .game-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 4px 0;
    font-size: 0.85rem;
    flex-wrap: nowrap;
}
.match-card .scores-inline .game-row input {
    width: 50px;
    padding: 4px 6px;
    text-align: center;
    font-size: 0.85rem;
    min-width: 40px;
}
.match-card .scores-inline .game-row .label {
    min-width: 45px;
    color: var(--text-light);
    font-weight: 500;
    flex-shrink: 0;
}
.match-card .scores-inline .game-row .sep {
    color: var(--text-light);
}
.match-card .scores-inline .btn-group {
    margin-top: 8px;
    gap: 6px;
    justify-content: flex-end;
}
.match-card .scores-inline .btn-group button {
    padding: 4px 14px;
    font-size: 0.8rem;
    min-height: 32px;
}

/* SVG lines */
.bracket-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    transition: opacity 0.3s;
    overflow: visible !important;
}
.bracket-svg path {
    stroke: var(--primary);
    stroke-width: 2.5;
    fill: none;
    opacity: 0.35;
    stroke-linecap: round;
}
[data-theme="dark"] .bracket-svg path { opacity: 0.25; }

/* ---- Animated connector lines ---- */
.bracket-svg path {
    stroke-dasharray: 800;
    stroke-dashoffset: 800;
    animation: drawLine 1s ease forwards;
}
@keyframes drawLine {
    to {
        stroke-dashoffset: 0;
    }
}
.bracket-svg {
    transition: opacity 1s;
}

/* Tooltip (global) */
.tooltip {
    position: fixed;
    background: var(--surface-solid);
    backdrop-filter: var(--backdrop-blur);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 16px 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2), 0 0 0 1px var(--glass-border);
    z-index: 9998;
    display: none;
    min-width: 200px;
    animation: fadeIn 0.2s ease;
    color: var(--text);
    pointer-events: none;
    transition: left 0.05s, top 0.05s;
}
.tooltip.active { display: block; }
.tooltip .tooltip-title {
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--primary);
}
.tooltip .tooltip-game {
    font-size: 0.85rem;
    padding: 2px 0;
    color: var(--text-light);
}
.tooltip .tooltip-game .score-highlight {
    color: var(--text);
    font-weight: 600;
}
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}
.tooltip-game .game-label {
    margin-right: 2px;
}
.no-bracket {
    text-align: center;
    padding: 40px 20px;
    font-size: 1.1rem;
    color: var(--text-light);
}
@media (max-width: 800px) {
    .container { padding: 20px; }
    .bracket-view { flex-direction: column; align-items: center; gap: 20px; }
    .round-wrapper { min-width: 100%; }
    .btn-group button { flex: 1 1 100%; }
    h1 { font-size: 1.6rem; }
}
.match-card .match .team.tbd {
    color: var(--text-light);
    font-style: italic;
}
.group-label {
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text-light);
    margin-right: 6px;
    min-width: 70px;
}
.btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
}
.btn-group:last-child {
    margin-bottom: 0;
}
/* ---- Ensure team names are clickable when expanded ---- */
.match-card .team:not(.winner)[style*="cursor: pointer"]:hover {
    background: var(--highlight);
}
.match-card .team.winner[style*="cursor: pointer"]:hover {
    background: #4caf50 !important;
    cursor: default;
}</style>
</head>
<body>
    <div class="container">
        <div class="title-wrapper">
            <h1>test🌓Manage teams, generate28</h1>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        </div>
        <div class="subhead" style="display:flex; gap:15px; align-items:center;">
            <span>Tournament Bracket</span>
            <div style="flex:1;"></div>
            <button onclick="location.href='/'" class="secondary">Dashboard</button>
        </div>
        <div id="bracketContainer" class="bracket-view">
            <div class="no-bracket">Loading bracket...</div>
        </div>
    </div>

    <script>
        // ===== API HELPER =====
        async function apiFetch(url, options = {}) {
            try {
                const res = await fetch(url, options);
                if (!res.ok) {
                    let errMsg = `Server error (${res.status})`;
                    try {
                        const data = await res.json();
                        if (data.message) errMsg = data.message;
                    } catch (_) {}
                    showToast(errMsg, true);
                    return null;
                }
                return await res.json();
            } catch (error) {
                showToast('🔌 Connection lost – is Tourney Hall still running?', true);
                console.error('API fetch error:', error);
                return null;
            }
        }

        // ===== TOAST =====
        function showToast(text, isError = false) {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : 'success'}`;
            toast.innerHTML = `<span>${text}</span><span class="toast-close">&times;</span>`;
            toast.querySelector('.toast-close').addEventListener('click', () => {
                toast.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            });
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.style.animation = 'slideOut 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        // ===== THEME =====
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }
        const saved = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);

        // ===== BRACKET LOGIC =====
        let currentBracket = null;
        let scoresData = {};
        let tempScores = {};

        async function loadScores() {
            const data = await apiFetch('/api/scores');
            if (data) scoresData = data;
        }

        function getRoundName(idx, total) {
            const names = [];
            if (total >= 1) names.push('Final');
            if (total >= 2) names.push('Semi‑finals');
            if (total >= 3) names.push('Quarter‑finals');
            if (total >= 4) names.push('Round of 16');
            if (total >= 5) names.push('Round of 32');
            if (total >= 6) names.push('Round of 64');
            names.reverse();
            return idx < names.length ? names[idx] : `Round ${idx+1}`;
        }

        async function loadBracket() {
            await loadScores();
            const container = document.getElementById('bracketContainer');
            container.innerHTML = '<div class="no-bracket">Loading...</div>';
            const rounds = await apiFetch('/api/bracket');
            if (!rounds) {
                container.innerHTML = '<div class="no-bracket">⚠️ Could not load bracket – is the server running?</div>';
                return;
            }
            if (!rounds.length) {
                container.innerHTML = '<div class="no-bracket">No bracket generated.</div>';
                return;
            }
            currentBracket = rounds;
            renderBracket(rounds);
        }

        // ===== RENDER BRACKET =====
        function renderBracket(rounds) {
            const container = document.getElementById('bracketContainer');
            container.innerHTML = '';
            container.style.position = 'relative';
            const total = rounds.length;

            rounds.forEach((round, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'round-wrapper';
                wrapper.style.display = 'flex';
                wrapper.style.flexDirection = 'column';
                wrapper.style.justifyContent = 'flex-start';
                wrapper.style.flex = '1';

                const title = document.createElement('div');
                title.className = 'round-title';
                title.textContent = getRoundName(idx, total);
                wrapper.appendChild(title);

                const matchContainer = document.createElement('div');
                matchContainer.className = 'match-container';
                matchContainer.style.display = 'flex';
                matchContainer.style.flexDirection = 'column';
                matchContainer.style.justifyContent = 'flex-start';
                matchContainer.style.flex = '1';
                matchContainer.style.width = '100%';
                matchContainer.style.position = 'relative';

                round.forEach(match => {
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.dataset.matchId = match.id;
                    card.dataset.round = idx;

                    const t1 = match.team1;
                    const t2 = match.team2;
                    const winner = match.winner;

                    const matchDiv = document.createElement('div');
                    matchDiv.className = 'match';
                    if (winner) matchDiv.classList.add('has-winner');

                    const teamsDiv = document.createElement('div');
                    teamsDiv.className = 'teams';

                    // ---- Team 1 ----
                    const t1Span = document.createElement('span');
                    t1Span.className = 'team';
                    if (t1 === null || t1 === undefined) {
                        t1Span.textContent = 'TBD';
                        t1Span.classList.add('tbd');
                    } else if (t1 === 'Bye') {
                        t1Span.textContent = '—';
                        t1Span.classList.add('bye');
                    } else {
                        const school = typeof t1 === 'string' ? '' : t1.school;
                        const name = typeof t1 === 'string' ? t1 : t1.name;
                        t1Span.innerHTML = `<strong>${school}</strong><span class="sub">${name}</span>`;
                        if (winner && (winner === name || (typeof winner === 'object' && winner.name === name))) {
                            t1Span.classList.add('winner');
                        }
                    }
                    teamsDiv.appendChild(t1Span);

                    const sep = document.createElement('span');
                    sep.className = 'separator';
                    sep.textContent = 'vs';
                    teamsDiv.appendChild(sep);

                    // ---- Team 2 ----
                    const t2Span = document.createElement('span');
                    t2Span.className = 'team';
                    if (t2 === null || t2 === undefined) {
                        t2Span.textContent = 'TBD';
                        t2Span.classList.add('tbd');
                    } else if (t2 === 'Bye') {
                        t2Span.textContent = '—';
                        t2Span.classList.add('bye');
                    } else {
                        const school = typeof t2 === 'string' ? '' : t2.school;
                        const name = typeof t2 === 'string' ? t2 : t2.name;
                        t2Span.innerHTML = `<strong>${school}</strong><span class="sub">${name}</span>`;
                        if (winner && (winner === name || (typeof winner === 'object' && winner.name === name))) {
                            t2Span.classList.add('winner');
                        }
                    }
                    teamsDiv.appendChild(t2Span);

                    matchDiv.appendChild(teamsDiv);

                    // ---- Winner badge ----
                    const isBye = (t1 === 'Bye' || t1 === null || t1 === undefined ||
                                t2 === 'Bye' || t2 === null || t2 === undefined);
                    if (winner && !isBye) {
                        const badge = document.createElement('div');
                        badge.className = 'winner-badge';
                        const stored = scoresData[match.id] || { games: [] };
                        const games = stored.games || [];
                        const t1w = games.filter(g => g[0] > g[1]).length;
                        const t2w = games.filter(g => g[1] > g[0]).length;
                        badge.textContent = `${t1w} : ${t2w}`;
                        matchDiv.appendChild(badge);
                    }

                    // ---- Inline scores ----
                    const scoresDiv = document.createElement('div');
                    scoresDiv.className = 'scores-inline';
                    scoresDiv.id = `scores-${match.id}`;

                    if (!isBye) {
                        card.addEventListener('click', (e) => {
                            if (e.target.closest('input') || e.target.closest('button') || e.target.closest('select')) return;
                            toggleScores(match.id, card);
                        });
                    }

                    matchDiv.appendChild(scoresDiv);
                    card.appendChild(matchDiv);

                    matchContainer.appendChild(card);
                });

                wrapper.appendChild(matchContainer);
                container.appendChild(wrapper);
            });

            // Wait for layout, then align and draw lines
            setTimeout(() => {
                alignBracket(rounds);
                drawCurvyLines();
            }, 150);
        }

        // ===== ALIGN BRACKET (reset margins first) =====
        function alignBracket(rounds) {
            for (let i = 0; i < rounds.length - 1; i++) {
                const children = document.querySelectorAll(`.match-card[data-round="${i}"]`);
                const parents = document.querySelectorAll(`.match-card[data-round="${i+1}"]`);
                if (children.length === 0 || parents.length === 0) continue;

                for (let p = 0; p < parents.length; p++) {
                    const child1 = children[p * 2];
                    const child2 = children[p * 2 + 1];
                    if (!child1 || !child2) continue;

                    // Reset parent styles before computing positions
                    parents[p].style.marginTop = '0px';
                    parents[p].style.transform = '';

                    const container = child1.parentElement;
                    const containerRect = container.getBoundingClientRect();
                    const child1Rect = child1.getBoundingClientRect();
                    const child2Rect = child2.getBoundingClientRect();

                    const child1Center = child1Rect.top + child1Rect.height / 2 - containerRect.top;
                    const child2Center = child2Rect.top + child2Rect.height / 2 - containerRect.top;
                    const avgCenter = (child1Center + child2Center) / 2;

                    const parentRect = parents[p].getBoundingClientRect();
                    const parentCenter = parentRect.top + parentRect.height / 2 - containerRect.top;

                    const offset = avgCenter - parentCenter;

                    // Use marginTop for positive offsets, transform for negative
                    if (offset >= 0) {
                        parents[p].style.marginTop = offset + 'px';
                        parents[p].style.transform = '';
                    } else {
                        parents[p].style.marginTop = '0px';
                        parents[p].style.transform = `translateY(${offset}px)`;
                    }
                }
            }
        }

        // ===== UPDATE GAME INPUTS =====
        window.updateGameInputs = function(matchId) {
            const select = document.getElementById(`firstToSelect_${matchId}`);
            if (!select) return;
            const firstTo = parseInt(select.value);
            const maxGames = (2 * firstTo) - 1;

            const container = document.getElementById(`gameInputs_${matchId}`);
            if (!container) return;

            const currentValues = {};
            const existingRows = container.querySelectorAll('.game-row');
            existingRows.forEach((row, idx) => {
                const i = idx + 1;
                const s1 = row.querySelector('input[id^="score1_"]');
                const s2 = row.querySelector('input[id^="score2_"]');
                if (s1 && s2) {
                    currentValues[`${i}_1`] = s1.value;
                    currentValues[`${i}_2`] = s2.value;
                }
            });

            let html = '';
            for (let i = 1; i <= maxGames; i++) {
                const v1 = currentValues[`${i}_1`] || '';
                const v2 = currentValues[`${i}_2`] || '';
                html += `<div class="game-row">
                    <span class="label">Game ${i}:</span>
                    <input type="number" id="score1_${matchId}_${i}" value="${v1}" placeholder="0" min="0" style="width:50px;text-align:center;">
                    <span class="sep">:</span>
                    <input type="number" id="score2_${matchId}_${i}" value="${v2}" placeholder="0" min="0" style="width:50px;text-align:center;">
                </div>`;
            }
            container.innerHTML = html;

            const newGames = [];
            const newRows = container.querySelectorAll('.game-row');
            newRows.forEach(row => {
                const s1 = row.querySelector('input[id^="score1_"]');
                const s2 = row.querySelector('input[id^="score2_"]');
                if (s1 && s2) {
                    const v1 = parseInt(s1.value) || 0;
                    const v2 = parseInt(s2.value) || 0;
                    newGames.push([v1, v2]);
                }
            });
            if (!tempScores[matchId]) tempScores[matchId] = {};
            tempScores[matchId].games = newGames;
            tempScores[matchId].firstTo = firstTo;

            setTimeout(() => drawCurvyLines(), 400);
        };

        // ===== SCORES TOGGLE =====
        function toggleScores(matchId, card) {
            const scoresDiv = document.getElementById(`scores-${matchId}`);
            if (!scoresDiv) return;

            const match = findMatch(matchId);
            if (!match) return;
            const t1 = match.team1;
            const t2 = match.team2;
            if (t1 === null || t1 === undefined || t1 === 'Bye' ||
                t2 === null || t2 === undefined || t2 === 'Bye') {
                return;
            }

            if (scoresDiv.classList.contains('active')) {
                scoresDiv.classList.remove('active');
                const teamSpans = card.querySelectorAll('.team');
                teamSpans.forEach(span => {
                    span.onclick = null;
                    span.style.cursor = 'default';
                });
                setTimeout(() => drawCurvyLines(), 400);
                return;
            }

            const t1Name = typeof t1 === 'string' ? t1 : t1.name;
            const t2Name = typeof t2 === 'string' ? t2 : t2.name;

            const stored = scoresData[matchId] || { games: [], best_of: 1 };
            const savedGames = stored.games || [];
            const firstTo = stored.best_of || 1;

            const temp = tempScores[matchId] || {};
            const games = temp.games || savedGames.map(g => [...g]);
            const currentFirstTo = temp.firstTo || firstTo;

            let html = '';

            html += `<div style="margin-bottom:8px;">
                <label>First to:
                    <select id="firstToSelect_${matchId}" style="padding:4px 8px; border-radius:6px;" 
                        onclick="event.stopPropagation();" 
                        onchange="updateGameInputs(${matchId})">
                        <option value="1" ${currentFirstTo===1?'selected':''}>1</option>
                        <option value="2" ${currentFirstTo===2?'selected':''}>2</option>
                        <option value="3" ${currentFirstTo===3?'selected':''}>3</option>
                        <option value="4" ${currentFirstTo===4?'selected':''}>4</option>
                    </select>
                </label>
            </div>`;

            html += `<div id="gameInputs_${matchId}">`;
            const maxGamesToShow = Math.max(1, (2 * currentFirstTo) - 1);
            for (let i = 1; i <= maxGamesToShow; i++) {
                const val1 = (games.length >= i) ? games[i-1][0] : '';
                const val2 = (games.length >= i) ? games[i-1][1] : '';
                html += `<div class="game-row">
                    <span class="label">Game ${i}:</span>
                    <input type="number" id="score1_${matchId}_${i}" value="${val1}" placeholder="0" min="0" style="width:50px;text-align:center;">
                    <span class="sep">:</span>
                    <input type="number" id="score2_${matchId}_${i}" value="${val2}" placeholder="0" min="0" style="width:50px;text-align:center;">
                </div>`;
            }
            html += `</div>`;

            html += `<div class="btn-group" style="margin-top:8px; justify-content:flex-end;">
                <button onclick="saveScores(${matchId}, '${t1Name}', '${t2Name}')">Save Scores</button>
            </div>`;

            scoresDiv.innerHTML = html;
            scoresDiv.classList.add('active');

            const teamSpans = card.querySelectorAll('.team');
            if (teamSpans.length >= 2) {
                const team1 = teamSpans[0];
                const team2 = teamSpans[1];
                team1.onclick = null;
                team2.onclick = null;
                team1.onclick = (e) => {
                    e.stopPropagation();
                    manualWinner(matchId, t1Name);
                };
                team2.onclick = (e) => {
                    e.stopPropagation();
                    manualWinner(matchId, t2Name);
                };
                team1.style.cursor = 'pointer';
                team2.style.cursor = 'pointer';
                team1.onmouseover = () => { team1.style.background = 'var(--highlight)'; };
                team1.onmouseout = () => { team1.style.background = 'transparent'; };
                team2.onmouseover = () => { team2.style.background = 'var(--highlight)'; };
                team2.onmouseout = () => { team2.style.background = 'transparent'; };
            }

            const inputs = scoresDiv.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('input', function() {
                    const currentGames = [];
                    const gameInputs = scoresDiv.querySelectorAll('.game-row');
                    gameInputs.forEach(row => {
                        const s1 = row.querySelector('input[id^="score1_"]');
                        const s2 = row.querySelector('input[id^="score2_"]');
                        if (s1 && s2) {
                            const v1 = parseInt(s1.value) || 0;
                            const v2 = parseInt(s2.value) || 0;
                            currentGames.push([v1, v2]);
                        }
                    });
                    const firstToSelect = document.getElementById(`firstToSelect_${matchId}`);
                    const firstToVal = firstToSelect ? parseInt(firstToSelect.value) : 1;
                    tempScores[matchId] = {
                        games: currentGames,
                        firstTo: firstToVal
                    };
                });
            });

            const firstToSelect = document.getElementById(`firstToSelect_${matchId}`);
            if (firstToSelect) {
                const newSelect = firstToSelect.cloneNode(true);
                firstToSelect.parentNode.replaceChild(newSelect, firstToSelect);
                newSelect.addEventListener('change', function() {
                    const currentGames = [];
                    const gameInputs = scoresDiv.querySelectorAll('.game-row');
                    gameInputs.forEach(row => {
                        const s1 = row.querySelector('input[id^="score1_"]');
                        const s2 = row.querySelector('input[id^="score2_"]');
                        if (s1 && s2) {
                            const v1 = parseInt(s1.value) || 0;
                            const v2 = parseInt(s2.value) || 0;
                            currentGames.push([v1, v2]);
                        }
                    });
                    const firstToVal = parseInt(this.value);
                    tempScores[matchId] = {
                        games: currentGames,
                        firstTo: firstToVal
                    };
                    updateGameInputs(matchId);
                });
            }

            setTimeout(() => drawCurvyLines(), 400);
        }

        // ===== SAVE SCORES =====
        async function saveScores(matchId, t1Name, t2Name) {
            const games = [];
            const inputs = document.querySelectorAll(`input[id^="score1_${matchId}_"]`);
            if (inputs.length === 0) {
                showToast('No scores to save.', true);
                return;
            }
            inputs.forEach((el, idx) => {
                const i = idx + 1;
                const s1 = parseInt(document.getElementById(`score1_${matchId}_${i}`).value) || 0;
                const s2 = parseInt(document.getElementById(`score2_${matchId}_${i}`).value) || 0;
                games.push([s1, s2]);
            });
            let t1w = 0, t2w = 0;
            games.forEach(([s1, s2]) => {
                if (s1 > s2) t1w++;
                else if (s2 > s1) t2w++;
            });
            let winner = null;
            if (t1w > t2w) winner = t1Name;
            else if (t2w > t1w) winner = t2Name;
            else {
                showToast('Tie – manual override required.', true);
                await apiFetch('/api/set_score', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ match_id: matchId, games, best_of: 2 })
                });
                loadBracket();
                return;
            }

            await apiFetch('/api/set_score', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ match_id: matchId, games, best_of: 2 })
            });

            const data = await apiFetch('/api/advance', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ match_id: matchId, winner })
            });
            if (!data) return;
            if (data.success) {
                delete tempScores[matchId];
                showToast(`Winner: ${winner}`, false);
                loadBracket();
            } else {
                showToast('Error: ' + data.message, true);
            }
        }

        async function manualWinner(matchId, winnerName) {
            if (!confirm(`Set "${winnerName}" as winner?`)) return;
            const data = await apiFetch('/api/advance', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ match_id: matchId, winner: winnerName })
            });
            if (!data) return;
            if (data.success) {
                showToast(`Winner: ${winnerName}`, false);
                loadBracket();
            } else {
                showToast('Error: ' + data.message, true);
            }
        }

        // ===== CURVY LINES =====
        function drawCurvyLines() {
            const container = document.getElementById('bracketContainer');
            if (!container) return;
            document.querySelectorAll('.bracket-svg').forEach(el => el.remove());

            const rect = container.getBoundingClientRect();
            const contentWidth = container.scrollWidth;
            const contentHeight = container.scrollHeight;

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('class', 'bracket-svg');
            svg.style.width = contentWidth + 'px';
            svg.style.height = contentHeight + 'px';
            svg.style.opacity = '0';

            const cards = container.querySelectorAll('.match-card');
            const positions = {};
            cards.forEach(el => {
                const id = parseInt(el.dataset.matchId);
                const r = el.getBoundingClientRect();
                positions[id] = {
                    top: r.top - rect.top + (r.height / 2),
                    left: r.left - rect.left + r.width - 2,
                    right: r.left - rect.left + 2
                };
            });

            const rounds = container.querySelectorAll('.round-wrapper');
            for (let i = 0; i < rounds.length - 1; i++) {
                const current = rounds[i].querySelectorAll('.match-card');
                const next = rounds[i+1].querySelectorAll('.match-card');
                for (let j = 0; j < current.length; j += 2) {
                    const parentIdx = Math.floor(j / 2);
                    if (parentIdx >= next.length) break;
                    const child1 = current[j];
                    const child2 = current[j+1] || current[j];
                    const parent = next[parentIdx];
                    if (!child1 || !parent) continue;

                    const c1Id = parseInt(child1.dataset.matchId);
                    const c2Id = child2 !== child1 ? parseInt(child2.dataset.matchId) : null;
                    const pId = parseInt(parent.dataset.matchId);

                    const c1Pos = positions[c1Id];
                    const c2Pos = c2Id !== null ? positions[c2Id] : null;
                    const pPos = positions[pId];
                    if (!c1Pos || !pPos) continue;

                    const midY = c2Pos ? (c1Pos.top + c2Pos.top) / 2 : c1Pos.top;
                    const startX = c1Pos.left;
                    const endX = pPos.right;
                    const midX = (startX + endX) / 2;

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const d = `M ${startX} ${c1Pos.top} Q ${midX} ${c1Pos.top}, ${midX} ${midY} Q ${midX} ${pPos.top}, ${endX} ${pPos.top}`;
                    path.setAttribute('d', d);
                    svg.appendChild(path);

                    if (c2Pos) {
                        const startX2 = c2Pos.left;
                        const d2 = `M ${startX2} ${c2Pos.top} Q ${midX} ${c2Pos.top}, ${midX} ${midY}`;
                        const path2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        path2.setAttribute('d', d2);
                        svg.appendChild(path2);
                    }
                }
            }

            container.appendChild(svg);
            requestAnimationFrame(() => {
                svg.style.opacity = '1';
            });
        }

        // ===== HELPERS =====
        function findMatch(matchId) {
            if (!currentBracket) return null;
            for (const round of currentBracket) {
                for (const match of round) {
                    if (match.id === matchId) return match;
                }
            }
            return null;
        }

        window.addEventListener('resize', () => {
            setTimeout(drawCurvyLines, 200);
        });

        // ===== INIT =====
        loadBracket();
    </script>
</body>
