html, body {

    transform: none !important;

:root {

    --text: rgba(26,26,46,0.94);
    --text-light: rgba(90,106,122,0.9);
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --border: rgba(0,0,0,0.08);
    --shadow: 0 8px 32px rgba(0,0,0,0.08);
    --glass-border: rgba(255,255,255,0.62);
    --highlight: rgba(26,115,232,0.06);
    --bye-color: #999;
    --error-bg: #fee;
    --success-bg: #e6ffed;
    --backdrop-blur: blur(18px) saturate(135%);
}
[data-theme="dark"] {
    --bg-start: #111827;
    --bg-end: #24324a;
    --surface: rgba(25,28,46,0.5);
    --surface-solid: rgba(25,28,46,0.66);
    --text: rgba(232,232,240,0.94);
    --text-light: rgba(180,184,204,0.9);
    --primary: #75a7ff;
    --primary-dark: #4a8cf7;
    --border: rgba(255,255,255,0.08);
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --glass-border: rgba(255,255,255,0.14);
    --highlight: rgba(74,140,247,0.1);
    --bye-color: #888;
    --error-bg: #2a1414;
    --success-bg: #142a1a;

* { box-sizing: border-box; margin: 0; padding: 0; }
body {

    background:
        radial-gradient(circle at 12% 15%, rgba(255,255,255,0.72), transparent 28%),

    color: var(--text);
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    transition: background 0.4s, color 0.3s;
    background-attachment: fixed;
    margin: 0;
}
.container {
    max-width: 1200px;
    width: 100%;
    background: var(--surface);
    backdrop-filter: var(--backdrop-blur);
    -webkit-backdrop-filter: var(--backdrop-blur);
    padding: 35px 40px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    border: 1px solid var(--glass-border);
    transition: all 0.3s;
    position: relative;
    z-index: 1;
}
.title-wrapper {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 4px;
}
h1 {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--primary);
    margin: 0;
    letter-spacing: -0.5px;
    outline: none;
    border: none;
    background: transparent;
    padding: 0;
    width: 100%;
    font-family: inherit;
}
h1:focus {
    outline: 2px dashed var(--primary);
    outline-offset: 6px;
    border-radius: 4px;
}
.theme-toggle {
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: 999px;
    width: 72px;
    height: 40px;
    cursor: pointer;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: 0.2s;
    color: var(--text);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.theme-toggle:hover { transform: translateY(-1px); }
.subhead {
    color: var(--text-light);
    margin-bottom: 25px;
    font-size: 1rem;
}
.section {
    background: rgba(255,255,255,0.28);
    padding: 20px 24px;
    border-radius: 8px;
    margin-bottom: 24px;
    border: 1px solid var(--border);
    transition: background 0.3s;
}
.section h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-top: 0;
    margin-bottom: 12px;
    color: var(--text);
}
input, textarea, button {
    padding: 10px 14px;
    margin: 4px 4px 4px 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--surface-solid);
    color: var(--text);
    transition: border 0.2s, box-shadow 0.2s, background 0.3s;
}
input:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
}
button {
    background: var(--primary);
    color: #fff;
    border: none;
    cursor: pointer;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 10px;
    transition: 0.15s;
    box-shadow: 0 2px 6px rgba(26,115,232,0.2);
    font-size: 0.95rem;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
button:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(26,115,232,0.3);
    background: var(--primary-dark);
}
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
button.secondary {
    background: var(--surface-solid);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: none;
}
button.secondary:hover { background: var(--highlight); transform: none; }
button.danger {
    background: #f44336;
    box-shadow: 0 2px 6px rgba(244,67,54,0.25);
}
button.danger:hover { background: #d32f2f; }
.btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
}
.btn-group button { flex: 0 1 auto; }
.school-group { margin-bottom: 16px; }
.school-header {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--primary);
    padding: 4px 0;
    border-bottom: 2px solid var(--border);
    margin-bottom: 8px;
}
.team-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 0;
}
.team-chip {
    background: var(--surface-solid);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 0.9rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
}
.team-chip .delete-btn {
    background: none;
    border: none;
    color: #f44336;
    font-weight: bold;
    cursor: pointer;
    padding: 0 4px;
    font-size: 1.1rem;
    box-shadow: none;
    min-height: auto;
}
.team-chip .seed-badge {
    color: #f5a623;
    font-weight: 600;
    font-size: 0.8rem;
}
.batch-area {
    width: 100%;
    min-height: 120px;
    font-family: 'Consolas', monospace;
    font-size: 0.9rem;
    padding: 12px;
    resize: vertical;
    background: var(--surface-solid);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
}
/* Toast container – fixed to viewport */
#toast-container {
    position: fixed !important;
    top: 24px !important;
    right: 24px !important;
    z-index: 99999 !important;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
}
.toast {
    pointer-events: auto;
    background: var(--surface-solid);
    padding: 14px 20px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    border-left: 6px solid var(--primary);
    animation: slideIn 0.3s ease;
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 500;
    color: var(--text);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--backdrop-blur);
}
.toast.error { border-left-color: #f44336; }
.toast.success { border-left-color: #4caf50; }
.toast .toast-close {
    cursor: pointer;
    margin-left: auto;
    font-weight: bold;
    color: var(--text-light);
    font-size: 1.2rem;
}
.toast .toast-close:hover { color: var(--text); }
@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
@keyframes slideOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(100%); opacity: 0; }
}

/* ===== BRACKET VIEW ===== */
.bracket-view {
    position: relative;
    display: flex;
    flex-direction: row;
    justify-content: center;
    overflow-x: auto;
    padding: 20px 20px 10px 20px;
    gap: 30px;
}
.round-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    min-width: 170px;
    flex: 0 0 auto;
}
.round-wrapper .match-container {
    justify-content: flex-start !important;
}
.round-title {
    text-align: center;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 6px 18px;
    margin-bottom: 18px;
    background: var(--surface-solid);
    border-radius: 8px;
    display: inline-block;
    margin-left: auto;
    margin-right: auto;
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--backdrop-blur);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    color: var(--primary);
    letter-spacing: 0.3px;
}
.match-card {
    position: relative;
    z-index: 1;
    margin: 8px 0;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    background: var(--surface-solid);
    border-radius: 8px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    padding: 12px 16px;
    border-left: 4px solid var(--primary);
    backdrop-filter: var(--backdrop-blur);
    overflow: visible !important;
    width: 200px;          /* fixed width, enough for scores */
    min-width: 200px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
}
.match-card .match {
    width: 100%;
}
.match-card:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.match-card.has-winner {
    border-left-color: #4caf50;
}
/* ---- Team formatting (School-first) ---- */
.match-card .match .teams {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    gap: 4px;
}
.match-card .match .team {
    flex: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    font-weight: 700;
    font-size: 1rem;
    padding: 4px 8px;
    border-radius: 8px;
    transition: background 0.15s;
    cursor: default;
}
.match-card .match .team strong {
    font-weight: 700;
    font-size: 1rem;
}
.match-card .match .team .sub {
    font-size: 0.75rem;
    color: var(--text-light);
    font-weight: 400;
}
.match-card .match .team.bye {
    color: var(--bye-color);
    font-style: italic;
    font-weight: 400;
}
.match-card .match .team.winner {
    background: #4caf50 !important;
    color: #fff !important;
    border-radius: 8px;
    padding: 4px 12px;
}
.match-card .match .team.winner strong {
    color: #fff !important;
}
.match-card .match .team.winner .sub {
    color: #a5d6a7 !important;
}
.match-card .match .separator {
    flex: 0 0 auto;
    font-size: 0.85rem;
    font-weight: 300;
    color: var(--text-light);
    padding: 0 4px;
}
/* --- Winner badge (overall score) --- */
.match-card .winner-badge {
    font-size: 0.9rem;
    color: #2e7d32;
    margin-top: 4px;
    font-weight: 600;
    background: var(--success-bg);
    padding: 2px 14px;
    border-radius: 20px;
    text-align: center;
}
/* --- Inline scores (expands to full width) --- */
.match-card .scores-inline {
    margin-top: 0 !important;
    padding-top: 0 !important;
    border-top: 1px solid var(--border);
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
    width: 100%;
}
.match-card .scores-inline.active {
    margin-top: 10px !important;
    padding-top: 10px !important;
    max-height: 500px;
    opacity: 1;
}
.match-card .scores-inline .game-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 4px 0;
    font-size: 0.85rem;
    flex-wrap: nowrap;
}
.match-card .scores-inline .game-row input {
    width: 50px;
    padding: 4px 6px;
    text-align: center;
    font-size: 0.85rem;
    min-width: 40px;
}
.match-card .scores-inline .game-row .label {
    min-width: 45px;
    color: var(--text-light);
    font-weight: 500;
    flex-shrink: 0;
}
.match-card .scores-inline .game-row .sep {
    color: var(--text-light);
}
.match-card .scores-inline .btn-group {
    margin-top: 8px;
    gap: 6px;
    justify-content: flex-end;
}
.match-card .scores-inline .btn-group button {
    padding: 4px 14px;
    font-size: 0.8rem;
    min-height: 32px;
}

/* SVG lines */
.bracket-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    transition: opacity 0.3s;
    overflow: visible !important;
}
.bracket-svg path {
    stroke: var(--primary);
    stroke-width: 2.5;
    fill: none;
    opacity: 0.35;
    stroke-linecap: round;
}
[data-theme="dark"] .bracket-svg path { opacity: 0.25; }

/* ---- Animated connector lines ---- */
.bracket-svg path {
    stroke-dasharray: 800;
    stroke-dashoffset: 800;
    animation: drawLine 1s ease forwards;
}
@keyframes drawLine {
    to {
        stroke-dashoffset: 0;
    }
}
.bracket-svg {
    transition: opacity 1s;
}

/* Tooltip (global) */
.tooltip {
    position: fixed;
    background: var(--surface-solid);
    backdrop-filter: var(--backdrop-blur);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 16px 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2), 0 0 0 1px var(--glass-border);
    z-index: 9998;

    min-width: 200px;
    animation: fadeIn 0.2s ease;
    color: var(--text);
    pointer-events: none;
    transition: left 0.05s, top 0.05s;
}
.tooltip.active { display: block; }
.tooltip .tooltip-title {
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--primary);
}
.tooltip .tooltip-game {
    font-size: 0.85rem;
    padding: 2px 0;
    color: var(--text-light);
}
.tooltip .tooltip-game .score-highlight {
    color: var(--text);
    font-weight: 600;
}
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}
.tooltip-game .game-label {
    margin-right: 2px;
}
.no-bracket {
    text-align: center;
    padding: 40px 20px;
    font-size: 1.1rem;
    color: var(--text-light);
}
@media (max-width: 800px) {
    .container { padding: 20px; }
    .bracket-view { flex-direction: column; align-items: center; gap: 20px; }
    .round-wrapper { min-width: 100%; }
    .btn-group button { flex: 1 1 100%; }
    h1 { font-size: 1.6rem; }
}

}
.group-label {
    font-weight: 600;
    font-size: 0.85rem;

    min-width: 70px;
}
.btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
}
.btn-group:last-child {
    margin-bottom: 0;
}

.match-card .team:not(.winner)[style*="cursor: pointer"]:hover {
    background: var(--highlight);
}
.match-card .team.winner[style*="cursor: pointer"]:hover {
    background: #4caf50 !important;
    cursor: default;

nt_id":20},{"id":10,"team1":{"name":"Team F1","school":"School F","seed":true,"active":true},"team2":{"name":"Team L1","school":"School L","seed":false,"active":true},"winner":null,"parent_id":21},{"id":11,"team1":{"name":"Team F2","school":"School F","seed":false,"active":true},"team2":{"name":"Team P2","school":"School P","seed":false,"active":true},"winner":null,"parent_id":21},{"id":12,"team1":{"name":"Team D1","school":"School D","seed":true,"active":true},"team2":{"name":"Team K1","school":"School K","seed":false,"active":true},"winner":null,"parent_id":22},{"id":13,"team1":{"name":"Team D2","school":"School D","seed":false,"active":true},"team2":{"name":"Team O2","school":"School O","seed":false,"active":true},"winner":null,"parent_id":22},{"id":14,"team1":{"name":"Team H1","school":"School H","seed":true,"active":true},"team2":{"name":"Team M1","school":"School M","seed":false,"active":true},"winner":null,"parent_id":23},{"id":15,"team1":{"name":"Team H2","school":"School H","seed":false,"active":true},"team2":"Bye","winner":{"name":"Team H2","school":"School H","seed":false,"active":true},"parent_id":23}],[{"id":16,"team1":{"name":"Team A1","school":"School A","seed":true,"active":true},"team2":{"name":"Team N1","school":"School N","seed":false,"active":true},"winner":{"name":"Team N1","school":"School N","seed":false,"active":true},"left_child":0,"right_child":1,"parent_id":24},{"id":17,"team1":null,"team2":null,"winner":null,"left_child":2,"right_child":3,"parent_id":24},{"id":18,"team1":null,"team2":null,"winner":null,"left_child":4,"right_child":5,"parent_id":25},{"id":19,"team1":null,"team2":{"name":"Team G2","school":"School G","seed":false,"active":true},"winner":null,"left_child":6,"right_child":7,"parent_id":25},{"id":20,"team1":null,"team2":null,"winner":null,"left_child":8,"right_child":9,"parent_id":26},{"id":21,"team1":null,"team2":null,"winner":null,"left_child":10,"right_child":11,"parent_id":26},{"id":22,"team1":null,"team2":null,"winner":null,"left_child":12,"right_child":13,"parent_id":27},{"id":23,"team1":null,"team2":{"name":"Team H2","school":"School H","seed":false,"active":true},"winner":null,"left_child":14,"right_child":15,"parent_id":27}],[{"id":24,"team1":{"name":"Team N1","school":"School N","seed":false,"active":true},"team2":null,"winner":null,"left_child":16,"right_child":17,"parent_id":28},{"id":25,"team1":null,"team2":null,"winner":null,"left_child":18,"right_child":19,"parent_id":28},{"id":26,"team1":null,"team2":null,"winner":null,"left_child":20,"right_child":21,"parent_id":29},{"id":27,"team1":null,"team2":null,"winner":null,"left_child":22,"right_child":23,"parent_id":29}],[{"id":28,"team1":null,"team2":null,"winner":null,"left_child":24,"right_child":25,"parent_id":30},{"id":29,"team1":null,"team2":null,"winner":null,"left_child":26,"right_child":27,"parent_id":30}],[{"id":30,"team1":null,"team2":null,"winner":null,"left_child":28,"right_child":29}]];
        const embeddedScores = {"0":{"games":[[2,0],[1,0],[0,0]],"best_of":2},"1":{"games":[[0,0],[0,1],[0,1]],"best_of":2}};
        const teamWins = {"Team A1":1,"Team N1":2,"Team G2":1,"Team H2":1};

        let scoresData = embeddedScores;
        let currentBracket = embeddedBracket;
        let tooltipTimeout = null;

        // ===== ROUND NAMES =====
        function getRoundName(idx, total) {
            const names = [];
            if (total >= 1) names.push('Final');
            if (total >= 2) names.push('Semi‑finals');
            if (total >= 3) names.push('Quarter‑finals');
            if (total >= 4) names.push('Round of 16');
            if (total >= 5) names.push('Round of 32');
            if (total >= 6) names.push('Round of 64');
            names.reverse();
            return idx < names.length ? names[idx] : `Round ${idx+1}`;
        }

        // ===== RENDER BRACKET =====
        function renderBracket(rounds) {
            const container = document.getElementById('bracketContainer');
            container.innerHTML = '';
            container.style.position = 'relative';
            const total = rounds.length;

            rounds.forEach((round, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'round-wrapper';
                wrapper.style.display = 'flex';
                wrapper.style.flexDirection = 'column';
                wrapper.style.justifyContent = 'flex-start';
                wrapper.style.flex = '1';

                const title = document.createElement('div');
                title.className = 'round-title';
                title.textContent = getRoundName(idx, total);
                wrapper.appendChild(title);

                const matchContainer = document.createElement('div');
                matchContainer.className = 'match-container';
                matchContainer.style.display = 'flex';
                matchContainer.style.flexDirection = 'column';
                matchContainer.style.justifyContent = 'flex-start';
                matchContainer.style.flex = '1';
                matchContainer.style.width = '100%';
                matchContainer.style.position = 'relative';

                round.forEach(match => {
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.dataset.matchId = match.id;
                    card.dataset.round = idx;

                    const t1 = match.team1;
                    const t2 = match.team2;
                    const winner = match.winner;

                    const matchDiv = document.createElement('div');
                    matchDiv.className = 'match';
                    if (winner) matchDiv.classList.add('has-winner');

                    const teamsDiv = document.createElement('div');
                    teamsDiv.className = 'teams';

                    // Team 1
                    const t1Span = document.createElement('span');
                    t1Span.className = 'team';
                    if (t1 === null || t1 === undefined) {
                        t1Span.textContent = 'TBD';
                        t1Span.classList.add('tbd');
                    } else if (t1 === 'Bye') {
                        t1Span.textContent = '—';
                        t1Span.classList.add('bye');
                    } else {
                        const school = typeof t1 === 'string' ? '' : t1.school;
                        const name = typeof t1 === 'string' ? t1 : t1.name;
                        t1Span.innerHTML = `<strong>${school}</strong><span class="sub">${name}</span>`;
                        if (winner && (winner === name || (typeof winner === 'object' && winner.name === name))) {
                            t1Span.classList.add('winner');
                        }
                    }
                    teamsDiv.appendChild(t1Span);

                    const sep = document.createElement('span');
                    sep.className = 'separator';
                    sep.textContent = 'vs';
                    teamsDiv.appendChild(sep);

                    // Team 2
                    const t2Span = document.createElement('span');
                    t2Span.className = 'team';
                    if (t2 === null || t2 === undefined) {
                        t2Span.textContent = 'TBD';
                        t2Span.classList.add('tbd');
                    } else if (t2 === 'Bye') {
                        t2Span.textContent = '—';
                        t2Span.classList.add('bye');
                    } else {
                        const school = typeof t2 === 'string' ? '' : t2.school;
                        const name = typeof t2 === 'string' ? t2 : t2.name;
                        t2Span.innerHTML = `<strong>${school}</strong><span class="sub">${name}</span>`;
                        if (winner && (winner === name || (typeof winner === 'object' && winner.name === name))) {
                            t2Span.classList.add('winner');
                        }
                    }
                    teamsDiv.appendChild(t2Span);

                    matchDiv.appendChild(teamsDiv);

                    // Winner badge
                    const isBye = (t1 === 'Bye' || t1 === null || t1 === undefined ||
                                   t2 === 'Bye' || t2 === null || t2 === undefined);
                    if (winner && !isBye) {
                        const badge = document.createElement('div');
                        badge.className = 'winner-badge';
                        const stored = scoresData[match.id] || { games: [] };
                        const games = stored.games || [];
                        const t1w = games.filter(g => g[0] > g[1]).length;
                        const t2w = games.filter(g => g[1] > g[0]).length;
                        badge.textContent = `${t1w} : ${t2w}`;
                        matchDiv.appendChild(badge);
                    }

                    // Inline scores (filtered to exclude 0:0)
                    const scoresDiv = document.createElement('div');
                    scoresDiv.className = 'scores-inline';
                    scoresDiv.id = `scores-${match.id}`;

                    if (!isBye) {
                        card.addEventListener('click', (e) => {
                            if (e.target.closest('input') || e.target.closest('button') || e.target.closest('select')) return;
                            toggleScores(match.id, card);
                        });
                    }

                    matchDiv.appendChild(scoresDiv);
                    card.appendChild(matchDiv);

                    matchContainer.appendChild(card);
                });

                wrapper.appendChild(matchContainer);
                container.appendChild(wrapper);
            });

            // After rendering, wait for layout, then align and draw lines
            console.log('Bracket rendered, waiting for layout...');
            // Use requestAnimationFrame to ensure layout is updated
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    console.log('Aligning bracket...');
                    alignBracket();
                    console.log('Drawing lines...');
                    drawCurvyLines();
                    console.log('Attaching tooltips...');
                    attachTooltips();
                });
            });
        }

        // ===== TOGGLE SCORES =====
        function toggleScores(matchId, card) {
            const scoresDiv = document.getElementById(`scores-${matchId}`);
            if (!scoresDiv) return;

            const match = findMatch(matchId);
            if (!match) return;
            const t1 = match.team1;
            const t2 = match.team2;
            if (t1 === null || t1 === undefined || t1 === 'Bye' ||
                t2 === null || t2 === undefined || t2 === 'Bye') {
                return;
            }

            if (scoresDiv.classList.contains('active')) {
                scoresDiv.classList.remove('active');
                setTimeout(() => {
                    alignBracket();
                    drawCurvyLines();
                }, 400);
                return;
            }

            const stored = scoresData[match.id] || { games: [], best_of: 1 };
            let games = stored.games || [];
            games = games.filter(g => g[0] !== 0 || g[1] !== 0);
            const firstTo = stored.best_of || 1;

            let html = '';
            const ftText = firstTo === 1 ? 'Single' : `FT${firstTo}`;
            html += `<div style="margin-bottom:8px; font-weight:600; color:var(--text-light);">${ftText}</div>`;

            html += `<div id="gameInputs_${matchId}">`;
            for (let i = 0; i < games.length; i++) {
                const g = games[i];
                html += `<div class="game-row">
                    <span class="label">Game ${i+1}:</span>
                    <span class="score-highlight">${g[0]}</span>
                    <span class="sep"> : </span>
                    <span class="score-highlight">${g[1]}</span>
                </div>`;
            }
            html += `</div>`;

            scoresDiv.innerHTML = html;
            scoresDiv.classList.add('active');

            setTimeout(() => {
                alignBracket();
                drawCurvyLines();
            }, 400);
        }

        // ===== FIND MATCH =====
        function findMatch(matchId) {
            if (!currentBracket) return null;
            for (const round of currentBracket) {
                for (const match of round) {
                    if (match.id === matchId) return match;
                }
            }
            return null;
        }

        // ===== ALIGN BRACKET =====
        function alignBracket() {
            const rounds = document.querySelectorAll('.round-wrapper');
            for (let i = 0; i < rounds.length - 1; i++) {
                const children = rounds[i].querySelectorAll('.match-card');
                const parents = rounds[i+1].querySelectorAll('.match-card');
                if (children.length === 0 || parents.length === 0) continue;

                const container = children[0]?.parentElement;
                if (!container) continue;
                const containerRect = container.getBoundingClientRect();

                for (let p = 0; p < parents.length; p++) {
                    const child1 = children[p * 2];
                    const child2 = children[p * 2 + 1];
                    if (!child1 || !child2) continue;

                    parents[p].style.marginTop = '0px';
                    parents[p].style.transform = '';

                    const child1Rect = child1.getBoundingClientRect();
                    const child2Rect = child2.getBoundingClientRect();
                    const child1Center = child1Rect.top + child1Rect.height / 2 - containerRect.top;
                    const child2Center = child2Rect.top + child2Rect.height / 2 - containerRect.top;
                    const avgCenter = (child1Center + child2Center) / 2;

                    const parentRect = parents[p].getBoundingClientRect();
                    const parentCenter = parentRect.top + parentRect.height / 2 - containerRect.top;
                    const offset = avgCenter - parentCenter;

                    if (offset >= 0) {
                        parents[p].style.marginTop = offset + 'px';
                        parents[p].style.transform = '';
                    } else {
                        parents[p].style.marginTop = '0px';
                        parents[p].style.transform = `translateY(${offset}px)`;
                    }
                }
            }
        }

        // ===== DRAW CURVY LINES =====
        function drawCurvyLines() {
            const container = document.getElementById('bracketContainer');
            if (!container) {
                console.error('Container not found');
                return;
            }
            document.querySelectorAll('.bracket-svg').forEach(el => el.remove());

            const rect = container.getBoundingClientRect();
            const contentWidth = container.scrollWidth || container.offsetWidth;
            const contentHeight = container.scrollHeight || container.offsetHeight;
            if (contentWidth === 0 || contentHeight === 0) {
                console.warn('Zero dimensions, retrying in 100ms');
                setTimeout(drawCurvyLines, 100);
                return;
            }

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('class', 'bracket-svg');
            svg.style.width = contentWidth + 'px';
            svg.style.height = contentHeight + 'px';
            svg.style.opacity = '0';

            const cards = container.querySelectorAll('.match-card');
            const positions = {};
            cards.forEach(el => {
                const id = Number(el.dataset.matchId);
                const r = el.getBoundingClientRect();
                positions[id] = {
                    top: r.top - rect.top + (r.height / 2),
                    left: r.left - rect.left + r.width - 2,
                    right: r.left - rect.left + 2
                };
            });

            const rounds = container.querySelectorAll('.round-wrapper');
            for (let i = 0; i < rounds.length - 1; i++) {
                const current = rounds[i].querySelectorAll('.match-card');
                const next = rounds[i+1].querySelectorAll('.match-card');
                for (let j = 0; j < current.length; j += 2) {
                    const parentIdx = Math.floor(j / 2);
                    if (parentIdx >= next.length) break;
                    const child1 = current[j];
                    const child2 = current[j+1] || current[j];
                    const parent = next[parentIdx];
                    if (!child1 || !parent) continue;

                    const c1Id = Number(child1.dataset.matchId);
                    const c2Id = child2 !== child1 ? Number(child2.dataset.matchId) : null;
                    const pId = Number(parent.dataset.matchId);

                    const c1Pos = positions[c1Id];
                    const c2Pos = c2Id !== null ? positions[c2Id] : null;
                    const pPos = positions[pId];
                    if (!c1Pos || !pPos) continue;

                    const midY = c2Pos ? (c1Pos.top + c2Pos.top) / 2 : c1Pos.top;
                    const startX = c1Pos.left;
                    const endX = pPos.right;
                    const midX = (startX + endX) / 2;

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const d = `M ${startX} ${c1Pos.top} Q ${midX} ${c1Pos.top}, ${midX} ${midY} Q ${midX} ${pPos.top}, ${endX} ${pPos.top}`;
                    path.setAttribute('d', d);
                    svg.appendChild(path);

                    if (c2Pos) {
                        const startX2 = c2Pos.left;
                        const d2 = `M ${startX2} ${c2Pos.top} Q ${midX} ${c2Pos.top}, ${midX} ${midY}`;
                        const path2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        path2.setAttribute('d', d2);
                        svg.appendChild(path2);
                    }
                }
            }

            container.appendChild(svg);
            requestAnimationFrame(() => {
                svg.style.opacity = '1';
            });
        }

        // ===== TOOLTIP =====
        const tooltip = document.createElement('div');
        tooltip.className = 'tooltip';
        tooltip.id = 'static-tooltip';
        document.body.appendChild(tooltip);

        function attachTooltips() {
            document.querySelectorAll('.match-card').forEach(card => {
                const scoresEl = card.querySelector('.scores-inline');
                const match = findMatch(Number(card.dataset.matchId));
                if (!scoresEl || !match || !match.winner) return;

                // Remove old listeners to prevent duplicates
                card.removeEventListener('mouseenter', onMouseEnter);
                card.removeEventListener('mousemove', onMouseMove);
                card.removeEventListener('mouseleave', onMouseLeave);

                card.addEventListener('mouseenter', onMouseEnter);
                card.addEventListener('mousemove', onMouseMove);
                card.addEventListener('mouseleave', onMouseLeave);

                function onMouseEnter(e) {
                    const winner = match.winner;
                    const winnerName = typeof winner === 'string' ? winner : winner.name;
                    const winnerSchool = typeof winner === 'string' ? '' : winner.school;
                    const wins = teamWins[winnerName] || 0;
                    const content = scoresEl.innerHTML.trim();
                    const scoreMarkup = content ? `<div class="tooltip-scores">${content}</div>` : '';
                    tooltip.innerHTML = `<div class="tooltip-title">${winnerSchool ? `${winnerSchool} – ` : ''}${winnerName}</div><div class="tooltip-wins">${wins} bracket wins in this tree</div>${scoreMarkup}`;
                    const rect = tooltip.getBoundingClientRect();
                    let x = e.clientX + 16;
                    let y = e.clientY + 16;
                    if (x + rect.width > window.innerWidth) x = e.clientX - rect.width - 16;
                    if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - 16;
                    tooltip.style.left = x + 'px';
                    tooltip.style.top = y + 'px';
                    tooltip.classList.add('active');
                    clearTimeout(tooltipTimeout);
                }

                function onMouseMove(e) {
                    if (tooltip.classList.contains('active')) {
                        const rect = tooltip.getBoundingClientRect();
                        let x = e.clientX + 16;
                        let y = e.clientY + 16;
                        if (x + rect.width > window.innerWidth) x = e.clientX - rect.width - 16;
                        if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - 16;
                        tooltip.style.left = x + 'px';
                        tooltip.style.top = y + 'px';
                    }
                }

                function onMouseLeave() {
                    clearTimeout(tooltipTimeout);
                    tooltipTimeout = setTimeout(() => {
                        tooltip.classList.remove('active');
                    }, 200);
                }
            });
        }

        // ===== THEME TOGGLE =====
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }
        const saved = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);

        window.addEventListener('resize', () => {
            alignBracket();
            drawCurvyLines();
        });

        // ===== HIDE DASHBOARD BUTTON =====
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.subhead button');
            buttons.forEach(btn => {
                if (btn.textContent.includes('Dashboard')) {
                    btn.style.display = 'none';
                }
            });
        });

        // ===== INIT =====
        // Wait for the whole page to load (including fonts, images) to ensure correct dimensions
        window.addEventListener('load', function() {
            console.log('Page fully loaded, rendering bracket...');
            renderBracket(embeddedBracket);
        });
    </script>
